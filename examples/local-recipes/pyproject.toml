[build-system]
requires = ["conan-py-build"]
build-backend = "conan_py_build.build"

[project]
name = "hello-local"
version = "0.1.0"
description = "Python bindings for libhello, whose Conan recipe ships with the project"
requires-python = ">=3.8"

[tool.conan-py-build]
# libhello has no recipe in ConanCenter, so this project ships one
local-recipes = ["recipes/hello"]
